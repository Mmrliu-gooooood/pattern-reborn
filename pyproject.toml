[build-system]
requires = ["setuptools>=68,<69", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-reborn"
version = "0.1.0"
description = "A local studio for traceable Chinese traditional-pattern projects."
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit>=1,<2",
    "pydantic>=2,<3",
    "opencv-python-headless>=4,<5",
    "Pillow>=10,<12",
    "numpy>=1,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "vtracer>=0,<1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
]
canvas = [
    "streamlit-drawable-konva==0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
